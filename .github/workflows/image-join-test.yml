name: image-join test

on:
  pull_request:
    paths:
      - "actions/image-join/**"
      - "tests/image-join/**"
      - ".github/workflows/image-join-test.yml"
  push:
    branches: [main]
    paths:
      - "actions/image-join/**"
      - "tests/image-join/**"
      - ".github/workflows/image-join-test.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the join harness against a throwaway registry
        run: bash tests/image-join/test_join.sh
